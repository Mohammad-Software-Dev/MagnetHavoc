name: Simulation smoke tests

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile and execute deterministic game-rule smoke tests
        run: dotnet run --project tools/SimulationSmoke/SimulationSmoke.csproj --configuration Release
